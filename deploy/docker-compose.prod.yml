# Production: DoorVoice listens on localhost only; a reverse proxy (Caddy) in front
# provides HTTPS and the site password. Run from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# An explicit project name, so it never shares the generic "deploy" name with other apps.
name: doorvoice
services:
  doorvoice:
    build: ..
    container_name: doorvoice
    ports:
      - "127.0.0.1:8190:3000"
    env_file: ../.env
    volumes:
      - ../data:/app/data # events, frames, audio, dataset, SQLite DB, pasted Ring token
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
